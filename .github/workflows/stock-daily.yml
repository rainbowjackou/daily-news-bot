name: 股票分析

on:
  # 每个交易日 17:30 北京时间（UTC 09:30）盘后分析
  # [2026-08-27] 注释用于强制 GitHub 注册 schedule
  schedule:
    - cron: '30 9 * * 1-5'
  # 允许手动触发，方便测试
  workflow_dispatch:

permissions:
  # 归档分析报告回仓库，保持仓库活跃
  contents: write

concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  stock-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行股票分析（标的在 scripts/stock-analysis.mjs 顶部 STOCKS 配置）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
        run: npm run stock-analysis

      - name: 推送到飞书群
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: node scripts/send-feishu.mjs stock-report.md

      - name: 归档分析报告并提交回仓库
        run: |
          git config user.name "daily-news-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/stock/
          if git diff --cached --quiet; then
            echo "无新报告，跳过提交"
          else
            git commit -m "docs: 股票分析归档 $(date +%Y-%m-%d)"
            git push
          fi

      - name: 上传分析报告（Actions 运行详情页可下载）
        uses: actions/upload-artifact@v4
        with:
          name: stock-report
          path: stock-report.md
          if-no-files-found: error
