name: 股票按需分析

on:
  # 由飞书桥接 Worker 通过 repository_dispatch 触发（@机器人 分析 XXX）
  repository_dispatch:
    types: [stock-analysis]

permissions:
  contents: write

concurrency:
  group: stock-on-demand
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行按需股票分析
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          STOCK_SECID: ${{ github.event.client_payload.stock.secid }}
          STOCK_NAME: ${{ github.event.client_payload.stock.name }}
          STOCK_KEYWORDS: ${{ github.event.client_payload.stock.keywords }}
        run: npm run stock-analysis

      - name: 推送到飞书群
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: node scripts/send-feishu.mjs stock-report.md

      - name: 归档分析报告并提交回仓库
        run: |
          git config user.name "daily-news-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/stock/
          if git diff --cached --quiet; then
            echo "无新报告，跳过提交"
          else
            git commit -m "docs: 股票按需分析归档 $(date +%Y-%m-%d)"
            git push
          fi

      - name: 上传分析报告
        uses: actions/upload-artifact@v4
        with:
          name: stock-report
          path: stock-report.md
          if-no-files-found: error
