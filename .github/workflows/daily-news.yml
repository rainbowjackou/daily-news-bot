name: 每日新闻简报

on:
  # 定时触发：每天 UTC 00:00 = 北京时间 08:00
  schedule:
    - cron: '0 0 * * *'
  # 允许手动触发，方便测试
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # dsh-rss-digest 要求 Node >= 22.18
      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 抓取新闻源（浏览器 UA、每源容错；源列表在 scripts/fetch-sources.mjs 顶部）
        run: npm run fetch-sources

      - name: 生成四段式简报（今日头条/科技财经/其他要闻/今日洞察）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run format

      - name: 推送到飞书群
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: npm run send-feishu

      - name: 上传简报存档（可在 Actions 运行详情页下载）
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest
          path: digest.md
          if-no-files-found: error
