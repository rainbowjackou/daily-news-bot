name: 每日新闻简报

on:
  # 定时触发：每天 UTC 00:00 = 北京时间 08:00
  # [2026-08-28] 仓库已改为 public（免费私有仓库 schedule 不触发是 GitHub 已知限制），push 强制重新注册 schedule
  # [2026-08-27] 本行注释用于强制 GitHub 重新注册 schedule（此前未自动注册，定时未触发）
  schedule:
    - cron: '0 0 * * *'
    # [2026-08-28 14:30 临时测试] 验证云端定时执行（12:42 那次因 push 后注册时间不足未触发，改 14:30 重试，跑完后移除本行）
    - cron: '30 6 * * *'
  # 允许手动触发，方便测试
  workflow_dispatch:

permissions:
  # 需要写权限：把简报归档提交回仓库（保持仓库活跃，避免 GitHub 60 天无活动暂停定时任务）
  contents: write

jobs:
  news-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # dsh-rss-digest 要求 Node >= 22.18
      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 抓取新闻源（浏览器 UA、每源容错；源列表在 scripts/fetch-sources.mjs 顶部）
        run: npm run fetch-sources

      - name: 抓取全球市场行情（新浪+腾讯+东方财富，多源交叉核验）
        run: npm run fetch-markets

      - name: 生成简报（市场速览 + 财经要闻/国内/国际/后市研判）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
        run: npm run format

      - name: 归档简报并提交回仓库（digests/ 永久留存 + 保持仓库活跃）
        run: |
          git config user.name "daily-news-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "无新简报变更，跳过提交"
          else
            git commit -m "docs: 每日新闻简报归档 $(date +%Y-%m-%d)"
            git push
          fi

      - name: 推送到飞书群
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: npm run send-feishu

      - name: 上传简报存档（可在 Actions 运行详情页下载）
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest
          path: digest.md
          if-no-files-found: error
